# NX Pad: an iPhone app that plays as a pair of Joy-Cons, or one held sideways, for a game nxnative runs (README.md).
# `xcodegen generate` in this folder writes NXPad.xcodeproj and Support/Info.plist; signing comes from Support/Signing.xcconfig.
name: NXPad
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  NXPad:
    type: application
    platform: iOS
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: NX Pad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: NX Pad finds games on your local network and sends them what you press.
        NSBonjourServices:
          - _nxpad._udp
        NSCameraUsageDescription: NX Pad reads the QR code your Mac shows to pair with it.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.nxnative.pad
            CFBundleURLSchemes: [nxpad]
    settings:
      base:
        PRODUCT_NAME: NXPad
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_PREVIEWS: YES
schemes:
  NXPad:
    build:
      targets:
        NXPad: all
    run:
      config: Debug
    archive:
      config: Release
